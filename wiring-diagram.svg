<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" width="100%" height="100%" style="background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .title { font-size: 20px; font-weight: bold; fill: #1f2328; text-anchor: middle; }
  .subtitle { font-size: 12px; fill: #656d76; text-anchor: middle; }
  .comp-label { font-size: 14px; font-weight: bold; fill: #1f2328; text-anchor: middle; }
  .pin-label { font-size: 11px; font-family: 'SFMono-Regular', Consolas, monospace; fill: #1f2328; }
  .note { font-size: 10px; fill: #57606a; }
  .wire { stroke: #57606a; stroke-width: 1.5; fill: none; }
  .wire-mic { stroke: #0969da; stroke-width: 1.5; fill: none; }
  .wire-dac { stroke: #bc4c00; stroke-width: 1.5; fill: none; }
  .wire-pwr { stroke: #cf222e; stroke-width: 1.5; fill: none; }
  .wire-gnd { stroke: #1f2328; stroke-width: 1.5; fill: none; }
  .pin-dot { fill: #1f2328; }
</style>
<text x="480" y="28" class="title">Pico + PCM5102A + INMP441 - Verdrahtung</text>
<text x="480" y="46" class="subtitle">10-Band-Vocoder, digitales I2S-Mikrofon statt MAX4466 (siehe DEVLOG)</text>
<rect x="40" y="70" width="200" height="490" rx="16" fill="#e6f5ec" stroke="#1a7f37" stroke-width="1.5"/>
<text x="140" y="96" class="comp-label">Raspberry Pi Pico</text>
<circle cx="240" cy="130" r="4" class="pin-dot"/>
<text x="228" y="134" class="pin-label" text-anchor="end">GP10</text>
<text x="52" y="134" class="note">Pin 14</text>
<circle cx="240" cy="160" r="4" class="pin-dot"/>
<text x="228" y="164" class="pin-label" text-anchor="end">GP11</text>
<text x="52" y="164" class="note">Pin 15</text>
<circle cx="240" cy="190" r="4" class="pin-dot"/>
<text x="228" y="194" class="pin-label" text-anchor="end">GP12</text>
<text x="52" y="194" class="note">Pin 16</text>
<circle cx="240" cy="300" r="4" class="pin-dot"/>
<text x="228" y="304" class="pin-label" text-anchor="end">GP16</text>
<text x="52" y="304" class="note">Pin 21</text>
<circle cx="240" cy="335" r="4" class="pin-dot"/>
<text x="228" y="339" class="pin-label" text-anchor="end">GP17</text>
<text x="52" y="339" class="note">Pin 22</text>
<circle cx="240" cy="370" r="4" class="pin-dot"/>
<text x="228" y="374" class="pin-label" text-anchor="end">GP18</text>
<text x="52" y="374" class="note">Pin 24</text>
<circle cx="240" cy="430" r="4" class="pin-dot"/>
<text x="228" y="434" class="pin-label" text-anchor="end">GP26</text>
<text x="52" y="434" class="note">Pin 31</text>
<circle cx="240" cy="480" r="4" class="pin-dot"/>
<text x="228" y="484" class="pin-label" text-anchor="end">3V3(OUT)</text>
<text x="52" y="484" class="note">Pin 36</text>
<circle cx="240" cy="525" r="4" class="pin-dot"/>
<text x="228" y="529" class="pin-label" text-anchor="end">GND</text>
<text x="52" y="529" class="note">z.B. Pin 13</text>
<text x="140" y="245" class="note" text-anchor="middle">pio1: I2S-Empfänger (Mic)</text>
<text x="140" y="258" class="note" text-anchor="middle">pio0: I2S-Sender (DAC)</text>
<rect x="650" y="90" width="230" height="215" rx="16" fill="#eaf2fd" stroke="#0969da" stroke-width="1.5"/>
<text x="765" y="112" class="comp-label">INMP441 (I2S-MEMS-Mic)</text>
<circle cx="650" cy="130" r="4" class="pin-dot"/>
<text x="662" y="134" class="pin-label">SCK</text>
<circle cx="650" cy="160" r="4" class="pin-dot"/>
<text x="662" y="164" class="pin-label">WS</text>
<circle cx="650" cy="190" r="4" class="pin-dot"/>
<text x="662" y="194" class="pin-label">SD</text>
<circle cx="650" cy="225" r="4" class="pin-dot"/>
<text x="662" y="229" class="pin-label">VDD</text>
<circle cx="650" cy="255" r="4" class="pin-dot"/>
<text x="662" y="259" class="pin-label">GND</text>
<circle cx="650" cy="280" r="4" class="pin-dot"/>
<text x="662" y="284" class="pin-label">L/R</text>
<text x="720" y="134" class="note">Bit-Takt, ~1,4 MHz</text>
<text x="720" y="164" class="note">Wortauswahl links/rechts</text>
<text x="720" y="194" class="note">Daten (int. Pulldown am Pico)</text>
<text x="720" y="229" class="note">nur 3,3 V, NICHT 5 V</text>
<text x="720" y="284" class="note">an GND = linker Kanal</text>
<rect x="650" y="385" width="230" height="270" rx="16" fill="#fef3e6" stroke="#bc4c00" stroke-width="1.5"/>
<text x="765" y="407" class="comp-label">PCM5102A (I2S-DAC)</text>
<circle cx="650" cy="420" r="4" class="pin-dot"/>
<text x="662" y="424" class="pin-label">BCK</text>
<circle cx="650" cy="455" r="4" class="pin-dot"/>
<text x="662" y="459" class="pin-label">LRCK</text>
<circle cx="650" cy="490" r="4" class="pin-dot"/>
<text x="662" y="494" class="pin-label">DIN</text>
<circle cx="650" cy="540" r="4" class="pin-dot"/>
<text x="662" y="544" class="pin-label">VIN</text>
<circle cx="650" cy="570" r="4" class="pin-dot"/>
<text x="662" y="574" class="pin-label">GND</text>
<rect x="665" y="582" width="200" height="66" rx="6" fill="none" stroke="#bc4c00" stroke-width="0.5" stroke-dasharray="3,3"/>
<text x="675" y="597" class="note">Jumper (fest, nicht Pico):</text>
<text x="675" y="610" class="note">XSMT=HIGH  FMT=I2S(LOW)</text>
<text x="675" y="623" class="note">DEMP=LOW  FLT=LOW  SCK=LOW</text>
<text x="675" y="636" class="note">-&gt; sonst dauerhaft stumm</text>
<path class="wire-mic" d="M244 130 L650 130"/>
<path class="wire-mic" d="M244 160 L650 160"/>
<path class="wire-mic" d="M244 190 L650 190"/>
<text x="445" y="122" class="note" text-anchor="middle">kurz halten (&lt; 15 cm), GND-Draht neben SCK führen</text>
<path class="wire-dac" d="M244 300 L600 300 L600 420 L650 420"/>
<path class="wire-dac" d="M244 335 L580 335 L580 455 L650 455"/>
<path class="wire-dac" d="M244 370 L560 370 L560 490 L650 490"/>
<text x="445" y="292" class="note" text-anchor="middle">räumlich getrennt von den Mic-Leitungen verlegen</text>
<path class="wire" d="M244 430 L286 430" stroke-dasharray="3,3"/>
<circle cx="286" cy="430" r="3" fill="none" stroke="#57606a" stroke-width="1.5"/>
<text x="248" y="422" class="note">Poti</text>
<path class="wire-pwr" d="M244 480 L300 480"/>
<path class="wire-pwr" d="M300 225 L300 294 A6 6 0 0 1 300 306 L300 329 A6 6 0 0 1 300 341 L300 364 A6 6 0 0 1 300 376 L300 540"/>
<path class="wire-pwr" d="M300 225 L650 225"/>
<path class="wire-pwr" d="M300 540 L324 540 A6 6 0 0 1 336 540 L650 540"/>
<circle cx="300" cy="480" r="3" fill="#cf222e"/>
<path class="wire-gnd" d="M244 525 L294 525 A6 6 0 0 1 306 525 L330 525"/>
<path class="wire-gnd" d="M330 255 L330 294 A6 6 0 0 1 330 306 L330 329 A6 6 0 0 1 330 341 L330 364 A6 6 0 0 1 330 376 L330 570"/>
<path class="wire-gnd" d="M330 255 L650 255"/>
<path class="wire-gnd" d="M330 570 L650 570"/>
<circle cx="330" cy="525" r="3" fill="#1f2328"/>
<path class="wire-gnd" d="M650 280 L625 280 L625 255"/>
<circle cx="625" cy="255" r="3" fill="#1f2328"/>
<g transform="translate(40,690)">
  <rect x="0" y="0" width="880" height="150" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="16" y="20" class="note" font-weight="bold">LEGENDE:</text>
  <rect x="16" y="30" width="14" height="14" rx="2" fill="#e6f5ec" stroke="#1a7f37"/>
  <text x="36" y="41" class="note">Pico</text>
  <rect x="100" y="30" width="14" height="14" rx="2" fill="#eaf2fd" stroke="#0969da"/>
  <text x="120" y="41" class="note">INMP441 (Mic, digital)</text>
  <rect x="290" y="30" width="14" height="14" rx="2" fill="#fef3e6" stroke="#bc4c00"/>
  <text x="310" y="41" class="note">PCM5102A (Audio-Ausgang)</text>
  <line x1="500" y1="37" x2="522" y2="37" stroke="#0969da" stroke-width="2"/>
  <text x="528" y="41" class="note">Mic-I2S</text>
  <line x1="590" y1="37" x2="612" y2="37" stroke="#bc4c00" stroke-width="2"/>
  <text x="618" y="41" class="note">DAC-I2S</text>
  <line x1="680" y1="37" x2="702" y2="37" stroke="#cf222e" stroke-width="2"/>
  <text x="708" y="41" class="note">3V3</text>
  <line x1="770" y1="37" x2="792" y2="37" stroke="#1f2328" stroke-width="2"/>
  <text x="798" y="41" class="note">GND</text>
  <text x="16" y="64" class="note">Punkt = Verbindung/Verzweigung. Bogen = Kreuzung OHNE Verbindung.</text>
  <text x="16" y="78" class="note">GND sternförmig: jede Masseleitung einzeln zum Pico-GND führen, nicht über die Steckbrett-Schiene (Masseschleife, siehe DEVLOG).</text>
  <text x="16" y="92" class="note">SCK/WS des Mics müssen aufeinanderfolgende GPIOs sein (WS = SCK + 1, side-set), SD ist frei wählbar. Ebenso BCK/LRCK beim DAC.</text>
  <text x="16" y="106" class="note">Pins in CMakeLists.txt (DAC: DATA_PIN=18, CLOCK_PIN_BASE=16) und main.cpp (kMicSckPin/kMicWsPin/kMicSdPin).</text>
  <text x="16" y="120" class="note">Entfallen gegenüber MAX4466-Aufbau: Mic-Vorverstärker, Spannungsteiler, 1-nF-Tiefpass, ADC-Eingang GP27 (jetzt frei).</text>
  <text x="16" y="134" class="note">Nur stromlos verkabeln; vor dem ersten Einschalten 3V3 gegen GND messen (einige kOhm normal, wenige Ohm = Kurzschluss).</text>
</g>
</svg>